  <div class="lock" id="lock">
    <form class="lock__box" id="lock-form" autocomplete="off">
      <span class="brand__name">Málaga</span>
      <label class="lock__label" for="lock-in">Zadejte kód</label>
      <input class="lock__in" id="lock-in" name="code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <p class="lock__err" id="lock-err" role="alert" hidden>Tenhle kód nesedí.</p>
      <button class="btn btn--primary">Vstoupit</button>
    </form>
  </div>

  <header class="top">
    <div class="top__in">
      <div class="brand">
        <span class="brand__name">Málaga</span>
      </div>
    </div>
  </header>

  <main id="app">
    <section class="panel" id="tab-dnes" data-tab="dnes" aria-labelledby="nav-dnes"></section>
    <section class="panel" id="tab-plan" data-tab="plan" aria-labelledby="nav-plan" hidden></section>
    <section class="panel" id="tab-vylety" data-tab="vylety" aria-labelledby="nav-vylety" hidden></section>
    <section class="panel" id="tab-jidlo" data-tab="jidlo" aria-labelledby="nav-jidlo" hidden></section>
    <section class="panel" id="tab-info" data-tab="info" aria-labelledby="nav-info" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Hlavní navigace">
    <button class="tabbar__btn" id="nav-dnes" data-go="dnes" aria-current="page"><svg><use href="#n-today"/></svg><span>Počasí</span></button>
    <button class="tabbar__btn" id="nav-vylety" data-go="vylety"><svg><use href="#n-trips"/></svg><span>Výlety</span></button>
    <button class="tabbar__btn" id="nav-jidlo" data-go="jidlo"><svg><use href="#n-food"/></svg><span>Jídlo</span></button>
    <button class="tabbar__btn" id="nav-plan" data-go="plan"><svg><use href="#n-plan"/></svg><span>Plán</span></button>
    <button class="tabbar__btn" id="nav-info" data-go="info"><svg><use href="#n-info"/></svg><span>Info</span></button>
  </nav>

  <dialog class="sheet" id="show-driver">
    <div class="sheet__body">
      <p class="sheet__eyebrow">Adresa ubytování</p>
      <p class="sheet__big" id="show-driver-text"></p>
      <button class="btn btn--primary" data-close>Zavřít</button>
    </div>
  </dialog>

  <dialog class="sheet sheet--bottom" id="sheet" aria-label="Výběr">
    <div class="sheet__body" id="sheet-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="data/trip.js"></script>
  <script src="data/activities.js"></script>
  <script src="data/tips.js"></script>
  <script src="data/food.js"></script>
  <script src="data/calendar.js"></script>
  <script src="plan.js"></script>
  <script src="app.js"></script>
</body>
</html>
