<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B5D8E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Málaga">
  <title>Málaga s dětmi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" style="fill:var(--sun)" stroke="none"/><g style="stroke:var(--sun)" stroke-width="1.9" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></symbol>
      <symbol id="i-partly" viewBox="0 0 24 24"><circle cx="8.6" cy="8.4" r="3.4" style="fill:var(--sun)"/><g style="stroke:var(--sun)" stroke-width="1.7" stroke-linecap="round"><path d="M8.6 2.4v1.4M2.6 8.4H4M4.4 4.2l1 1M12.8 4.2l-1 1"/></g><path d="M8.5 20h9a3.6 3.6 0 0 0 .4-7.2 5 5 0 0 0-9.6 1.2A3 3 0 0 0 8.5 20z" style="fill:var(--cloud)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.2 19h10.3a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.8 1.3A3.4 3.4 0 0 0 7.2 19z" style="fill:var(--cloud)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
      <symbol id="i-fog" viewBox="0 0 24 24"><path d="M7.2 14h10.3a3.6 3.6 0 0 0 .4-7.2 5.2 5.2 0 0 0-10 1.2A3 3 0 0 0 7.2 14z" style="fill:var(--cloud)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 17.5h16M6 20.5h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-drizzle" viewBox="0 0 24 24"><path d="M7.2 14.5h10.3a3.7 3.7 0 0 0 .4-7.4 5.3 5.3 0 0 0-10.2 1.2 3.1 3.1 0 0 0-.5 6.2z" style="fill:var(--cloud)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><g style="fill:var(--rain)"><circle cx="8.5" cy="18" r="1"/><circle cx="12.5" cy="19.5" r="1"/><circle cx="16.5" cy="18" r="1"/></g></symbol>
      <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7.2 14h10.3a3.7 3.7 0 0 0 .4-7.4 5.3 5.3 0 0 0-10.2 1.2A3.1 3.1 0 0 0 7.2 14z" style="fill:var(--cloud)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 16.5l-1.2 3.6M12.5 16.5l-1.2 3.6M16.5 16.5l-1.2 3.6" style="stroke:var(--rain)" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-showers" viewBox="0 0 24 24"><circle cx="8" cy="7.6" r="3" style="fill:var(--sun)"/><path d="M9 15.5h8.8a3.3 3.3 0 0 0 .3-6.6 4.6 4.6 0 0 0-8.8 1.1A2.8 2.8 0 0 0 9 15.5z" style="fill:var(--cloud)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M11 18l-1 2.8M15 18l-1 2.8" style="stroke:var(--rain)" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-storm" viewBox="0 0 24 24"><path d="M7.2 13.5h10.3a3.7 3.7 0 0 0 .4-7.4 5.3 5.3 0 0 0-10.2 1.2 3.1 3.1 0 0 0-.5 6.2z" style="fill:var(--cloud)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12.6 14.5l-2.4 4h3l-1.6 3.5" fill="none" style="stroke:var(--sun)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="n-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v1.8M12 19.2V21M3 12h1.8M19.2 12H21M5.6 5.6l1.3 1.3M17.1 17.1l1.3 1.3M5.6 18.4l1.3-1.3M17.1 6.9l1.3-1.3"/></symbol>
      <symbol id="n-trips" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></symbol>
      <symbol id="n-plane" viewBox="0 0 24 24"><path d="M10.2 20.5l1.6-6.2-5.2 1.3-1.4 2.1H3.6l1.2-3.6-1.2-3.6h1.6l1.4 2.1 5.2 1.3-1.6-6.2h2l3.7 6.1 4.1-1a1.8 1.8 0 0 1 0 3.5l-4.1-1-3.7 6.1z" stroke-linejoin="round"/></symbol>
      <symbol id="n-tips" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" stroke-linejoin="round"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5M20 20v-4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <header class="top">
    <div class="top__in">
      <div class="brand">
        <span class="brand__name">Málaga</span>
        <span class="brand__dates">31. 10. – 9. 11.</span>
      </div>
      <span class="countdown" id="countdown"></span>
    </div>
  </header>

  <main id="app">
    <section class="panel" id="tab-dnes" data-tab="dnes" aria-labelledby="nav-dnes"></section>
    <section class="panel" id="tab-vylety" data-tab="vylety" aria-labelledby="nav-vylety" hidden></section>
    <section class="panel" id="tab-cesta" data-tab="cesta" aria-labelledby="nav-cesta" hidden></section>
    <section class="panel" id="tab-tipy" data-tab="tipy" aria-labelledby="nav-tipy" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Hlavní navigace">
    <button class="tabbar__btn" id="nav-dnes" data-go="dnes" aria-current="page"><svg><use href="#n-today"/></svg><span>Dnes</span></button>
    <button class="tabbar__btn" id="nav-vylety" data-go="vylety"><svg><use href="#n-trips"/></svg><span>Výlety</span></button>
    <button class="tabbar__btn" id="nav-cesta" data-go="cesta"><svg><use href="#n-plane"/></svg><span>Cesta</span></button>
    <button class="tabbar__btn" id="nav-tipy" data-go="tipy"><svg><use href="#n-tips"/></svg><span>Tipy</span></button>
  </nav>

  <dialog class="sheet" id="show-driver">
    <div class="sheet__body">
      <p class="sheet__eyebrow">Adresa ubytování</p>
      <p class="sheet__big" id="show-driver-text"></p>
      <button class="btn btn--primary" data-close>Zavřít</button>
    </div>
  </dialog>

  <script src="data/trip.js"></script>
  <script src="data/activities.js"></script>
  <script src="data/tips.js"></script>
  <script src="app.js"></script>
</body>
</html>
